name: MTManager-iOS
options:
  bundleIdPrefix: com.jituileet
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  MTManagerTrollStore:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jituileet.mtmanager.trollstore
        PRODUCT_NAME: MTManagerTrollStore
        INFOPLIST_KEY_CFBundleDisplayName: MT管理器
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TROLLSTORE"
        GENERATE_INFOPLIST_FILE: YES
  MTManagerJailbreak:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jituileet.mtmanager.jailbreak
        PRODUCT_NAME: MTManagerJailbreak
        INFOPLIST_KEY_CFBundleDisplayName: MT管理器（越狱）
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) JAILBREAK"
        GENERATE_INFOPLIST_FILE: YES
